spring.application.name=market-rates

# Actuator on its own port (claude-factory ADR 0014): the app port serves only the API, so an ingress can't
# expose it. There: Kubernetes probes (/actuator/health/liveness|readiness, no internals) and Prometheus.
management.server.port=8081
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# JSON logs (ECS) for log collectors. Plain text locally: run with the `local` profile.
logging.structured.format.console=ecs

# Let in-flight requests finish when the pod is stopped.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Metrics: Prometheus only (the OpenTelemetry starter's OTLP metrics push is off). Latency histograms for SLOs.
management.otlp.metrics.export.enabled=false
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Traces: OpenTelemetry over OTLP. No endpoint here, so local runs and tests export nothing; each overlay sets
# MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT and MANAGEMENT_TRACING_SAMPLING_PROBABILITY.
# config/ObservabilityConfig strips raw request URLs (they carry identifiers) from spans.

# Live rates (docs/specs/0001-live-asset-rates.md). Add an asset by adding an entry of an existing kind/provider.
# Poll every 10 s; a rate is stale after 3 polls. Rates are rounded to market-rates.scale.<KIND> places.
market-rates.poll-interval=10s
market-rates.rounding-mode=HALF_EVEN
market-rates.scale.CRYPTO=8
market-rates.scale.METAL=2
market-rates.scale.FX=5
market-rates.scale.EQUITY=2
market-rates.scale.INDEX=2
market-rates.assets[0].id=btc-usdt
market-rates.assets[0].name=BTC/USDT
market-rates.assets[0].kind=CRYPTO
market-rates.assets[0].provider=binance
market-rates.assets[0].symbol=BTCUSDT
market-rates.assets[0].quote-currency=USDT
market-rates.assets[1].id=eth-usdt
market-rates.assets[1].name=ETH/USDT
market-rates.assets[1].kind=CRYPTO
market-rates.assets[1].provider=binance
market-rates.assets[1].symbol=ETHUSDT
market-rates.assets[1].quote-currency=USDT
market-rates.assets[2].id=qnt-usdt
market-rates.assets[2].name=QNT/USDT
market-rates.assets[2].kind=CRYPTO
market-rates.assets[2].provider=binance
market-rates.assets[2].symbol=QNTUSDT
market-rates.assets[2].quote-currency=USDT
market-rates.assets[3].id=xau-usdt
market-rates.assets[3].name=Gold
market-rates.assets[3].kind=METAL
market-rates.assets[3].provider=binance-futures
market-rates.assets[3].symbol=XAUUSDT
market-rates.assets[3].quote-currency=USDT
market-rates.assets[4].id=xag-usdt
market-rates.assets[4].name=Silver
market-rates.assets[4].kind=METAL
market-rates.assets[4].provider=binance-futures
market-rates.assets[4].symbol=XAGUSDT
market-rates.assets[4].quote-currency=USDT
market-rates.assets[5].id=eur-usdt
market-rates.assets[5].name=EUR/USDT
market-rates.assets[5].kind=FX
market-rates.assets[5].provider=binance
market-rates.assets[5].symbol=EURUSDT
market-rates.assets[5].quote-currency=USDT
market-rates.assets[6].id=nvda-usdt
market-rates.assets[6].name=Nvidia
market-rates.assets[6].kind=EQUITY
market-rates.assets[6].provider=binance-futures
market-rates.assets[6].symbol=NVDAUSDT
market-rates.assets[6].quote-currency=USDT
market-rates.assets[7].id=spy-usdt
market-rates.assets[7].name=S&P 500 (SPY)
market-rates.assets[7].kind=INDEX
market-rates.assets[7].provider=binance-futures
market-rates.assets[7].symbol=SPYUSDT
market-rates.assets[7].quote-currency=USDT

# Binance spot public API: no key. Calls are sequential: when assets x (connect + read) exceeds the poll interval,
# startup warns and a slow poll delays the next one (rates may go stale); it never fails.
market-rates.binance.base-url=https://api.binance.com
market-rates.binance.connect-timeout=1s
market-rates.binance.read-timeout=2s

# Binance USDⓈ-M futures public API (gold, silver, Nvidia, SPY perpetuals; spec 0002): no key, same call budget rules.
market-rates.binance-futures.base-url=https://fapi.binance.com
market-rates.binance-futures.connect-timeout=1s
market-rates.binance-futures.read-timeout=2s
